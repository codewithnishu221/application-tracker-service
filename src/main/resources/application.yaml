spring:
  application:
    name: APPLICATION-TRACKER-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5433/applicationtracker
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2       
      embedding:
        model: nomic-embed-text 
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  services:
    match-service-url: http://localhost:8083
  similarity:
    threshold: 75.0
  notifications:
    stale-days: 7