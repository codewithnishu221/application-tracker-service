spring:
  datasource:
    url: jdbc:postgresql://postgres-tracker:5433/applicationtracker
    username: postgres
    password: postgres
  data:
    redis:
      host: redis
      port: 6379
  ai:
    ollama:
      base-url: http://host.docker.internal:11434
  kafka:
    bootstrap-servers: kafka:9092  # container name

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  similarity:
    threshold: 75.0
  services:
    match-service-url: http://match-service:8083