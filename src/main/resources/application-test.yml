spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/applicationtracker_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    discovery:
      enabled: false # Disable Eureka during testing

app:
  jwt:
    secret: ${JWT_SECRET:test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing-purposes}
    expiration: 86400000
  similarity:
    threshold: 75.0
  notifications:
    stale-days: 7