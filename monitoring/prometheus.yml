global:
  scrape_interval: 15s      # pull metrics every 15 seconds
  evaluation_interval: 15s  # evaluate alert rules every 15 seconds

scrape_configs:
  # scrape User Service
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'user-service'

  # scrape Tracker Service
  - job_name: 'tracker-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'tracker-service'

  # scrape Match Service
  - job_name: 'match-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'match-service'

  # scrape Interview Prep Service
  - job_name: 'interview-prep-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          service: 'interview-prep-service'